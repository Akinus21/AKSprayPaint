name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build akspraypaint
        id: build_akspraypaint
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: Verify akspraypaint binary
        id: verify_akspraypaint
        run: |
          BINARY=target/release/akspraypaint
          if [ ! -f "$BINARY" ]; then
            echo "Binary not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$BINARY")
          echo "Binary size: $SIZE"
          if [ "$SIZE" -lt 10240 ]; then
            echo "Binary too small, likely from cache."
            exit 1
          fi

      - name: Clone and build matugen
        id: build_matugen
        run: |
          git clone --depth 1 https://github.com/InioX/matugen.git
          cd matugen
          cargo build --release
          mkdir -p ../matugen-target
          cp target/release/matugen ../matugen-target/
          cd ..
          rm -rf matugen
          if [ ! -f "matugen-target/matugen" ]; then
            echo "Matugen binary not found!"
            exit 1
          fi
          echo "Matugen built successfully"

      - name: Upload both binaries
        uses: actions/upload-artifact@v4
        with:
          name: akspraypaint-binary
          path: |
            target/release/akspraypaint
            matugen-target/matugen
          if-no-files-found: error

      - name: Determine next tag
        id: tag
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New tag: $NEW_TAG"

      - name: Bump version in Cargo.toml
        if: steps.tag.outputs.new_tag != ''
        id: bump
        run: |
          NEW_TAG=${{ steps.tag.outputs.new_tag }}
          NEW_VER=${NEW_TAG#v}
          sed -i -E "s/^version = \".*\"/version = \"${NEW_VER}\"/" Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to ${NEW_VER}"
          git push origin HEAD:${{ github.ref }}

      - name: Create and push tag
        if: steps.tag.outputs.new_tag != ''
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      - name: Compute SHA256 for both binaries
        id: sha
        run: |
          SHA_AK=$(sha256sum target/release/akspraypaint | awk '{print $1}')
          SHA_MATUGEN=$(sha256sum matugen-target/matugen | awk '{print $1}')
          echo "sha256_akspraypaint=$SHA_AK" >> $GITHUB_OUTPUT
          echo "sha256_matugen=$SHA_MATUGEN" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.new_tag }}
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Automated release of $TAG" \
            target/release/akspraypaint \
            matugen-target/matugen

      - name: Update Homebrew tap
        if: steps.tag.outputs.new_tag != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          TAG=${{ steps.tag.outputs.new_tag }}
          VER=${TAG#v}
          SHA_AK=${{ steps.sha.outputs.sha256_akspraypaint }}
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          git clone https://x-access-token:${TAP_TOKEN}@github.com/Akinus21/homebrew-tap.git tap-repo
          cd tap-repo
          FORMULA_PATH="Formula/akspraypaint.rb"
          cat > $FORMULA_PATH <<-'RUBY_EOF'
class Akspraypaint < Formula
  desc "AKSprayPaint command line utility"
  homepage "https://github.com/Akinus21/AKSprayPaint"
  url "REPO_URL/akspraypaint"
  sha256 "SHA_AK"
  version "VER"
  license "MIT"

  def install
    bin.install "akspraypaint"
    system "curl -sL REPO_URL/matugen -o #{bin}/matugen"
    chmod "+x", "#{bin}/matugen"
  end
end
RUBY_EOF
          sed -i "s|REPO_URL|${REPO_URL}|g" $FORMULA_PATH
          sed -i "s|SHA_AK|${SHA_AK}|g" $FORMULA_PATH
          sed -i "s|VER|${VER}|g" $FORMULA_PATH
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FORMULA_PATH
          git commit -m "akspraypaint ${VER}"
          git push origin master
